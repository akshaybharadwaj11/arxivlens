[project]
name = "arxivlens"
version = "0.1.0"
description = "Multi-modal RAG over scientific literature"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "psycopg[binary,pool]>=3.2.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-pubsub>=2.26.0",
    "google-cloud-aiplatform>=1.71.0",
    "google-genai>=0.3.0",
    "vertexai>=1.71.0",
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "structlog>=24.4.0",
    "sentence-transformers>=3.2.0",
    "numpy>=1.26.0",
    "Pillow>=10.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
]

parser = [
    "marker-pdf>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "arxivlens",
    "ingestion",
    "embedding",
    "retrieval",
    "generation",
    "safety",
    "eval",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

